name: SplitFedLLM
server:
  architecture: u-shape # layer_id 1: owner (front + tail), layer_id 2: body worker
  global-round: 1
  clients:
    - 1
    - 1
  cut-layers: 4
  tail-blocks: 0 # Head and final normalization stay local even with zero tail blocks
  model-name: Bert # GPT2/Llama/Bert
  data-name: EMOTION # EMOTION/GSM8K
  model:
    GPT2:
      n_block: 12
    Llama:
      n_block: 12
    Bert:
      n_block: 12
  parameters:
    load: True
    save: True
  validation: True
  data-distribution:
    non-iid: False
    num-sample: 500
    num-label: 10
    dirichlet:
      alpha: 1
    refresh-each-round: True
  random-seed: 1

rabbit:
  address: 127.0.0.1
  username: admin
  password: admin
  virtual-host: /

log_path: .
debug_mode: True

learning:
  learning-rate: 0.00001
  weight-decay: 0.01
  batch-size: 2
  control-count: 1 # First-stage graph window; >1 averages gradients before each update
  clip-grad-norm: 0.0
  u-shape:
    max-inflight: 2
    microbatches-per-window: 8 # Per-owner quota; may exceed max-inflight
    worker-max-inflight: 8 # Total live body graphs; at least the number of assigned owners
    timeout-seconds: 120

fine-tune:
  enable: True
  name: LoRA
  LoRA:
    r: 8
    alpha: 16
